# This structure defines each of the modules (sensors, actuators, controls) that can be discovered
# Please add new modules here, in alphabetical order
# Each module contains inputs &/o outputs, each of which should have
#
# Each module has
# name: Capitalized English (and add translation below in 'languages')
# topics: list of topics, each with leaf, optionally leaf_from if it should be copied, and optionally any fields of topics to be overridden
# slot: if it is supposed to fit in a specific slot of frugaliot
# insidefrugaliot: true if it should be hidden inside the Frugal_IoT drop-down on the name of a sensor, false or not set if it should be shown as a separate module
# summary: false to keep this module off a device's one-line summary. Omitted means it contributes -
#   default-visible, because a new sensor that is silently invisible until someone remembers a flag
#   is the worse failure. insidefrugaliot modules never contribute; they feed the status strip.
aht20:
  name: "AHT20"
  topics:
    - leaf: temperature
    - leaf: humidity
aht21:
  name: "AHT21"
  topics:
    - leaf: temperature
    - leaf: humidity
# The DS18B20 probes on an FF-OpenMPPT board - see frugal-iot-irrigation. Separate modules rather
# than one, because the three measure quite different things and want different ranges; the class
# is the same Sensor_DS18B20 as the `ds18b20` module below.
airtemp:
  name: Air Temperature
  topics:
    - leaf: airtemp
      leaf_from: temperature
      name: Air Temperature
      min: -20
      max: 60
analog:
  name: "Analog Out"
  topics:
    - leaf: volts
battery:
  name: "Battery"
  insidefrugaliot: true
  topics:
    - leaf:   battery
# How much of its rated capacity the battery still has, inferred from an overnight discharge.
# A trend over weeks, not a reading; see control_health.h. Named batteryhealth because `health` is
# already taken by the device's own reporting.
batteryhealth:
  name: Battery Health
  topics:
    - leaf: health
      leaf_from: percent
      name: Health
      duplicates:
        significantdate: 86400000
        significantvalue: 1
    - leaf: state
      leaf_from: controltext
      name: State
      rw: r
    - leaf: soc
      leaf_from: controlfloat
      name: Charge
      min: 0
      max: 100
    - leaf: capacity
      leaf_from: controlfloat
      name: Capacity Ah
      min: 0
      max: 500
      wireable: false
    - leaf: load
      leaf_from: controlfloat
      name: Average load A
      min: 0
      max: 50
      wireable: false
    - leaf: active
      leaf_from: controlint
      name: Irrigation active
      min: 0
      max: 16
    - leaf: panelwatts
      leaf_from: controlfloat
      name: Panel watts
      min: 0
      max: 2000
      wireable: false
    - leaf: storageratio
      leaf_from: controlfloat
      name: Storage ratio
      min: 0
      max: 50
      rw: r
      wireable: false
    - leaf: advice
      leaf_from: controltext
      name: Advice
      rw: r
batttemp:
  name: Battery Temperature
  topics:
    - leaf: batttemp
      leaf_from: temperature
      name: Battery Temperature
      min: -20
      max: 60
bme280:
  name: "BME280"
  topics:
    - leaf: temperature
    - leaf: humidity
    - leaf: pressure
bme680:
  name: "BME680"
  topics:
    - leaf: temperature
    - leaf: humidity
    - leaf: pressure
    - leaf: gas
bmp280:
  name: "BMP280"
  topics:
    - leaf: temperature
    - leaf: pressure
button:
  summary: false   # transient - a press is not a state worth a summary line
  name: Button
  topics:
    - leaf:     button
captive:
  summary: false   # a language code is not a reading
  name: Captive
  topics:
    - leaf:     language_code
carousel:
  summary: false   # a display selector is not a reading
  name: Display carousel
  topics:
    - leaf:     select
controlblinken:
  name: "Control Blinken"
  topics:
    - leaf:     timeon
    - leaf:     timeoff
    - leaf:     out
controlhysteresis:
  name: Control
  topics:
    - leaf: now
      leaf_from: controlfloat
      name: Now
    - leaf: greater
      leaf_from: controlintoggle
      name: Greater Than
    - leaf: limit
      leaf_from:  controlfloat
      name: Limit
    - leaf: hysteresis
      leaf_from: controlfloat
      name: Hysterisis
      max:  100
      wireable: false
    - leaf: out
      leaf_from: controlouttoggle
      name: Out
# Some nodes have misspeeled id for this control
controlhysterisis:
  name: Control
  topics:
    - leaf: now
      leaf_from: controlfloat
      name: Now
    - leaf: greater
      leaf_from: controlintoggle
      name: Greater Than
    - leaf: limit
      leaf_from:  controlfloat
      name: Limit
    - leaf: hysterisis
      leaf_from: controlfloat
      name: Hysterisis
      max:  100
      wireable: false
    - leaf: out
      leaf_from: controlouttoggle
      name: Out
dht:
  name: "DHT"
  topics:
    - leaf: temperature
    - leaf: humidity
ds18b20:
  name: "Soil Temperature"
  topics:
    - leaf: ds18b20
      leaf_from: temperature
do:
  name: "Dissolved Oxygen"
  topics:
    - leaf: do
ens160:
  name: "ENS160"
  topics:
    # Compensation inputs, not readings. The ENS160 has no thermometer of its own: it takes
    # ambient temperature and humidity from whatever is wired to it - an AHT21 sitting on the
    # same breakout, or any other sensor on the node. So these come from controlfloat (wireable,
    # rw: w, not logged) rather than from the temperature/humidity topics, which are read-only
    # readings - whichever sensor actually measures them is the one that logs them.
    - leaf: temperature
      leaf_from: controlfloat
      name: Temperature
      max:  50
      color: "#ff0000"
    - leaf: humidity
      leaf_from: controlfloat
      name: Humidity
      color: "#0000ff"
    - leaf: aqi
    - leaf: tvoc
    - leaf: eco2
    - leaf: aqi500
# Legacy - firmware before the ENS160/AHT21 split published everything under one module id.
# Kept so already-deployed nodes still display; new nodes use `ens160` and `aht21` above.
ensaht:
  name: "ENS AHT"
  topics:
    - leaf:  temperature
    - leaf:  humidity
    - leaf:  aqi
    - leaf:  tvoc
    - leaf:  eco2
    - leaf:  aqi500
frugal_iot:
  summary: false   # this is the card identity, not a module on it
  name: XXX
  topics:
    - leaf:     id
    - leaf:     name
    - leaf:     description
    - leaf:     lastseen
gps:
  name: GPS
  topics:
    - leaf:     latitude
    - leaf:     longitude
    - leaf:     altitude
    - leaf:     course
    - leaf:     speed
    - leaf:     satellites
    - leaf:     hdop
    - leaf:     position
    - leaf:     utc_time
health:
  name: System
  insidefrugaliot: true
  topics:
    - leaf:     wifibars
    - leaf:     wifissid
# The charge controller's own heatsink. Either a DS18B20 or a pair of diodes read on an ADC pin,
# depending on the board - the reading means the same either way.
heatsink:
  name: Heatsink Temperature
  topics:
    - leaf: heatsink
      leaf_from: temperature
      name: Heatsink Temperature
      min: 0
      max: 120
ht:
  name: HT
  topics:
    - leaf: temperature
    - leaf: humidity
ina219:
  name: "Power Monitor"
  topics:
    - leaf: shunt
    - leaf: bus
    - leaf: current
    - leaf: power
    - leaf: load
irrigation:
  name: Irrigation
  topics:
    - leaf: hour
      leaf_from: controlint
      name: Start hour
      min: 0
      max: 23
    - leaf: minute
      leaf_from: controlint
      name: Start minute
      min: 0
      max: 59
    - leaf: maxminutes
      leaf_from: controlfloat
      name: Max minutes per sector
      min: 0
      max: 120
    - leaf: enabled
      leaf_from: controlintoggle
      name: Enabled
    - leaf: tank
      leaf_from: controlfloat
      name: Tank level
      color: "#0000ff"
    - leaf: tankstart
      leaf_from: controlfloat
      name: Tank level to start
    - leaf: tankempty
      leaf_from: controlfloat
      name: Tank level to stop
    - leaf: power
      leaf_from: controlintoggle
      name: Power ok
      wireable: true
    - leaf: solar
      leaf_from: controlintoggle
      name: Input power
      wireable: true
    - leaf: pump
      leaf_from: controlouttoggle
      name: Pump
    - leaf: active
      leaf_from: controlint
      name: Active sector
      min: 0
      max: 16
lcd:
  summary: false   # a message is not a reading
  name: LCD
  topics:
    - leaf: message
# The switched load output - OSPIT's pin 14 in its "load" role, opened by the low-voltage
# disconnect. An Actuator_Digital, so the same shape as `relay`.
load:
  name: Load
  topics:
    - leaf:     on
ledbuiltin:
  name: LED
  slot: ledbuiltin
  insidefrugaliot: true
  topics:
    - leaf:     on
    - leaf:     color
    - leaf:     brightness
loadcell:
  name: Load Cell
  topics:
    - leaf:     loadcell
lux:
  name: Light meter
  topics:
    - leaf:     lux
# Solar charge control - see frugal-iot-irrigation. `step` is the raw DAC value because that is
# unambiguous; `vmpp` is what the node PREDICTS that step asks the hardware for, which is a guess
# until it has been checked against a meter.
mppt:
  name: Charge Control
  topics:
    - leaf: automatic
      leaf_from: controlintoggle
      name: Automatic
    - leaf: state
      leaf_from: controltext
      name: State
      rw: r
    - leaf: profile
      leaf_from: controlint
      name: Battery type
      min: 0
      max: 3
      wireable: false
    - leaf: chargeend
      leaf_from: controlfloat
      name: Charge end
      min: 10000
      max: 16000
      wireable: false
    - leaf: tempcoeff
      leaf_from: controlfloat
      name: Temp coefficient
      min: 0
      max: 60
      wireable: false
    - leaf: hotcharge
      leaf_from: controlfloat
      name: Hot battery
      min: 10000
      max: 16000
      wireable: false
    - leaf: batttemp
      leaf_from: controlfloat
      name: Battery temp
      min: -20
      max: 60
    - leaf: heatsink
      leaf_from: controlfloat
      name: Heatsink temp
      min: 0
      max: 120
    - leaf: target
      leaf_from: controlfloat
      name: Target
      min: 10000
      max: 16000
      rw: r
      wireable: false
    - leaf: step
      leaf_from: controlint
      name: DAC step
      min: 0
      max: 255
      wireable: false
    - leaf: panel
      leaf_from: controlfloat
      name: Panel
      min: 0
      max: 30000
    - leaf: battery
      leaf_from: controlfloat
      name: Battery
      min: 0
      max: 16000
    - leaf: voc
      leaf_from: controlfloat
      name: Open circuit
      min: 0
      max: 30000
      rw: r
      wireable: false
    - leaf: vmpp
      leaf_from: controlfloat
      name: Panel target
      min: 0
      max: 30
      rw: r
      wireable: false
    - leaf: dacvolts
      leaf_from: controlfloat
      name: DAC volts
      min: 0
      max: 3.3
      rw: r
ms5803:
  name: MS5803
  topics:
    - leaf: pressure
    - leaf: temperature
ota:
  name: OTA
  insidefrugaliot: true
  topics:
    - leaf:     key
panel:
  name: Solar Panel
  topics:
    - leaf: panel
      leaf_from: voltage
      name: Panel Voltage
      max: 30000
pcbtemp:
  name: Board Temperature
  topics:
    - leaf: pcbtemp
      leaf_from: temperature
      name: Board Temperature
      min: -20
      max: 100
pump:
  name: Pump
  topics:
    - leaf:     on
rain:
  name: Rain
  topics:
    - leaf: rain
    - leaf: mm
relay:
  name: Relay
  topics:
    - leaf:     on
# One sector of an irrigation run - see modules "irrigation". A node with several sectors publishes
# sector1, sector2... and the client resolves those numbered instances back to this entry, so only
# the one definition is needed here however many sectors a node has.
sector:
  name: Irrigation sector
  topics:
    - leaf: moisture
      leaf_from: controlfloat
      name: Moisture
      color: "#a52a2a"
    - leaf: target
      leaf_from: controlfloat
      name: Target
    - leaf: enable
      leaf_from: controlintoggle
      name: Enable
    - leaf: valve
      leaf_from: controlouttoggle
      name: Valve
sht:
  name: SHT
  topics:
    - leaf: temperature
    - leaf: humidity
# State of charge, estimated from battery voltage - reporting only, never controlled from. See
# control_soc.h in frugal-iot-irrigation for what the estimate is and is not worth.
soc:
  name: State of Charge
  topics:
    - leaf: soc
      leaf_from: percent
      name: Charge
      duplicates:
        significantdate: 900000
        significantvalue: 1
    - leaf: charging
      leaf_from: controlouttoggle
      name: Charging
    - leaf: battery
      leaf_from: controlfloat
      name: Battery
      min: 0
      max: 16000
    - leaf: panel
      leaf_from: controlfloat
      name: Panel
      min: 0
      max: 30000
    - leaf: profile
      leaf_from: controlint
      name: Battery type
      min: 0
      max: 3
      wireable: false
soil:
  name: Soil
  topics:
    - leaf: soil
tank:
  name: Water Tank
  topics:
    - leaf: tank
soilmodbus:
  name: "Soil Probe"
  topics:
    # Reuses the shared humidity and temperature definitions - same ranges, logging and
    # duplicate rules - overriding only what soil makes different from air.
    - leaf: humidity
      name: "Soil Moisture"
      color: brown
      units: "%"      # Volumetric water content, not the relative humidity the shared leaf means
    - leaf: temperature
      name: "Soil Temperature"
      color: brown
ultrasonic:
  name: "Ultrasonic Distance"
  topics:
    - leaf: ultrasonic
# The irrigation valves - Actuator_Digital instances, so the same shape as `relay`. A node with
# several publishes valve1, valve2... which the client resolves back to this entry.
# A switched USB supply - an Actuator_Digital, so the same shape as `relay`. On the FF board this
# shares a pin with the third irrigation valve; a node has one or the other.
usb:
  name: USB Supply
  topics:
    - leaf:     on
valve:
  name: Valve
  topics:
    - leaf:     on
