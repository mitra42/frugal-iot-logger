# This file defines the schema for the modules, and topics within them
# See https://github.com/mitra42/frugal-iot-logger/issues/8
# This will replace much of what is inside the organizations directory
#
# Define topics as shown in the UX or used for logging
#
# Each topics has
# leaf: the name as defined in the code, this is what will be used for MQTT topics
# name  Capitalized English (and add translation below in 'languages')
# max   For gauges, slider
# min   For gauges, slider
# width Total characters of the rendered number, including any sign and the decimal point and
#   excluding units - the same meaning the node gives it. Decimals are derived, not declared:
#   intWidth = max(len(int(min)), len(int(max))) including a '-', then decimals = width-intWidth-1.
#   Deriving from min/max rather than from the value keeps the decimal count steady as the value
#   moves. Only float and exponential topics need it; an int has no decimals to decide.
# color can be a name or a #RRGGBB
# display One of bar,gauge,text,slider,inputbox
# slot  if this topic fits into a specific slot in the enclosing module (currently just frugal_iot module)
# type One of bool,float,int,topic,text,yaml
# rw  r for outputs w for inputs
# graphable  true if can be displayed on a graph
# wireable true,false, generally only  controls are wireable
# wired not valid in this context, it will come from MQTT broker
# log  whether readings of this topic are recorded to disk. Say so either way on every topic: with
#   no setting at all, any float, int or bool with "rw: r" is recorded, which is easy to be
#   surprised by. scripts/check-schema.js warns about a topic that does not say.
# duplicates  when to bother recording a reading: significantvalue is how much it has to have moved
#   since the last one recorded - either an absolute amount e.g. 0.5, or as a percentage of the last
#   reading e.g. "2%" - significantdate how long (in milliseconds) since that one, and a
#   reading that meets neither is dropped. Every topic with "log: true" wants a rule here - without
#   one, every reading is written to the SD card as it arrives, which wears the card out.
# Note battery gets special cased
# See https://www.iana.org/assignments/senml/senml.xhtml for units
altitude:
  leaf:     altitude
  name:     Altitude
  type:     float
  units:    m
  display:  text
  min:      -500
  max:      9000
  width:    6
  color:    "#000000"
  log:      true
  duplicates:
    significantdate: 900000
    significantvalue: 1
  rw:       r
  graphable:  true
analog:
  leaf:     analog
  type:     int
  display:  bar
  rw:       r
  graphable:  true
  log:      true
  # A raw ADC reading with no declared range, so this threshold is a guess - lower it if real
  # changes are being missed, raise it if the graph is mostly noise
  duplicates:
    significantdate: 900000
    significantvalue: 10
aqi:
  leaf:     aqi
  name:     AQI
  type:     int
  display:  bar
  min:      0
  max:      5
  color:    "#800080"
  rw:       r
  graphable:  true
  log:      true
  duplicates:
    significantdate: 900000
    significantvalue: 1
aqi500:
